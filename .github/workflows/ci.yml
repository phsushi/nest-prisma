
name: Pipeline de Integração e Deploy Contínuo 

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificacao-da-api-nest:
    runs-on: ubuntu-latest

    steps:
      - name: Baixando o código no Github
        uses: actions/checkout@v4

      - name: Instalando o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        
      - name: Instalando dependências
        run: npm install

      - name: Rodando o Build do NestJs
        run: npm run build

      - name: Testando o Build da Imagem Docker
        run: docker build -t nest-prisma-api .

  entrega-docker-hub:
    runs-on: ubuntu-latest
    needs: verificacao-da-api-nest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nest-prisma-api:latest
